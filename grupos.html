<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programação do Ministério de Campo</title>
  <style>
    :root {
      --azul: #1f4e79;
      --azul-escuro: #17324d;
      --cinza: #f3f6f8;
      --linha: #d7dee5;
      --texto: #1f2933;
    }* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #dde3e8;
  color: var(--texto);
}

.barra-acoes {
  max-width: 980px;
  margin: 18px auto 10px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 9px 14px;
  font-weight: 700;
  cursor: pointer;
  background: var(--azul);
  color: white;
}

button.secundario {
  background: #e8eef3;
  color: var(--azul-escuro);
}

button.perigo {
  background: #b42318;
}

.pagina {
  max-width: 980px;
  min-height: 1380px;
  margin: 0 auto 30px;
  background: white;
  padding: 34px;
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
}

.cabecalho {
  background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
  color: white;
  border-radius: 18px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 26px;
}

.cabecalho h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.cabecalho p {
  margin: 8px 0 0;
  font-size: 15px;
  opacity: .9;
}

.cartao {
  border: 1px solid var(--linha);
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 26px;
  background: #fff;
}

.titulo-secao {
  background: var(--cinza);
  border-bottom: 1px solid var(--linha);
  padding: 16px;
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--azul-escuro);
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th {
  background: #edf3f8;
  color: var(--azul-escuro);
  text-transform: uppercase;
  font-size: 15px;
  padding: 13px 8px;
  border-bottom: 1px solid var(--linha);
}

td {
  padding: 0;
  border-bottom: 1px dashed #aeb8c2;
  border-right: 1px solid var(--linha);
  text-align: center;
  font-size: 20px;
}

td:last-child,
th:last-child {
  border-right: 0;
}

tr:last-child td {
  border-bottom: 0;
}

input {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: center;
  font-size: 20px;
  padding: 11px 8px;
  outline: none;
  color: var(--texto);
}

input:focus {
  background: #fff8d8;
}

.horario input {
  font-weight: 700;
  color: var(--azul);
}

.grupo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.grupo {
  border-right: 1px solid var(--linha);
}

.grupo:last-child {
  border-right: 0;
}

.grupo h3 {
  margin: 0;
  background: var(--azul-escuro);
  color: white;
  text-align: center;
  padding: 13px;
  font-size: 20px;
  text-transform: uppercase;
}

.pessoa {
  display: flex;
  border-bottom: 1px dashed #aeb8c2;
}

.pessoa:last-child {
  border-bottom: 0;
}

.pessoa input {
  flex: 1;
}

.botao-excluir {
  width: 34px;
  padding: 0;
  border-radius: 0;
  background: #fee2e2;
  color: #991b1b;
}

.rodape {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  margin-top: 18px;
}

@media (max-width: 720px) {
  .pagina {
    padding: 14px;
  }

  .cabecalho h1 {
    font-size: 23px;
  }

  th,
  td,
  input {
    font-size: 14px;
  }

  th {
    padding: 10px 4px;
  }

  input {
    padding: 9px 4px;
  }

  .grupo-grid {
    grid-template-columns: 1fr;
  }

  .grupo {
    border-right: 0;
    border-bottom: 1px solid var(--linha);
  }
}

@media print {
  body {
    background: white;
  }

  .barra-acoes {
    display: none;
  }

  .pagina {
    max-width: none;
    min-height: auto;
    margin: 0;
    padding: 16px;
    box-shadow: none;
  }

  .cabecalho {
    background: white !important;
    color: black;
    border: 2px solid black;
    border-radius: 0;
    padding: 18px;
  }

  .cabecalho p,
  .rodape,
  .botao-excluir {
    display: none;
  }

  .cartao {
    border: 2px solid black;
    border-radius: 0;
  }

  .titulo-secao,
  th,
  .grupo h3 {
    background: white !important;
    color: black;
  }

  td, th {
    border-color: black;
  }

  input {
    border: 0;
    padding: 7px 4px;
  }
}

  </style>
</head>
<body>
  <div class="barra-acoes">
    <button onclick="adicionarProgramacao()">+ Programação</button>
    <button onclick="adicionarPessoa('centro')">+ Grupo Centro</button>
    <button onclick="adicionarPessoa('norte')">+ Grupo Norte</button>
    <button class="secundario" onclick="salvar()">Salvar</button>
    <button class="secundario" onclick="restaurar()">Restaurar</button>
    <button onclick="window.print()">Imprimir / PDF</button>
  </div>  <main class="pagina">
    <header class="cabecalho">
      <h1>Programação do Ministério de Campo</h1>
      <p>Edite os campos, salve no navegador e imprima em PDF.</p>
    </header><section class="cartao">
  <div class="titulo-secao">Saídas de Campo</div>
  <table>
    <thead>
      <tr>
        <th>Dia da Semana</th>
        <th>Local de Saída</th>
        <th>Horário</th>
        <th>Dirigente</th>
        <th class="acao">Excluir</th>
      </tr>
    </thead>
    <tbody id="tabela-programacao"></tbody>
  </table>
</section>

<section class="cartao">
  <div class="titulo-secao">Grupos de Campo</div>
  <div class="grupo-grid">
    <div class="grupo">
      <h3>Grupo Centro</h3>
      <div id="grupo-centro"></div>
    </div>
    <div class="grupo">
      <h3>Grupo Norte</h3>
      <div id="grupo-norte"></div>
    </div>
  </div>
</section>

<div class="rodape">Programação organizada para uso impresso ou digital</div>

  </main>  <script>
    let programacao = [
      ['Quarta', 'Sueli', '07h45', 'Gisleno'],
      ['Quarta', 'Adelmo', '17h00', 'Simon'],
      ['Quinta', 'Zoom', '08h15', 'Gisleno'],
      ['Sexta', 'Salão do Reino', '07h45', 'Igor'],
      ['Sexta', 'José', '17h00', 'José'],
      ['Sábado', 'Salão do Reino', '07h45', 'José'],
      ['Domingo', 'Salão do Reino', '08h15', 'Gisleno'],
      ['Domingo', 'Adelmo', '08h15', 'Igor']
    ];

    let grupos = {
      centro: ['Gisleno Pinheiro (SG)', 'Morlânia Pinheiro', 'José Bezerra', 'Suenir Nascimento', 'Lara Silva', 'Gabriel Albuquerque', 'Miraneide Augusto', 'Mosirene Lima', 'Francisco Sales', 'Célia Nogueira', 'João Carneiro', 'Francilene Carneiro', 'Olimpio Ferreira', 'Lúcia Silva'],
      norte: ['Igor Gabriel (SG)', 'Tatiana Fernandes', 'Adelmo Martins', 'Evirlane Martins', 'Rebeca Martins', 'Sueli Barbosa', 'Simon Marinho', 'Jardênia Peixoto', 'Antônia Pereira', 'Alexsander Freitas', 'Sineide Marinho', 'Marizete Pereira', 'Tainara']
    };

    function renderizar() {
      const tabela = document.getElementById('tabela-programacao');
      tabela.innerHTML = '';

      programacao.forEach((linha, i) => {
        const tr = document.createElement('tr');
        linha.forEach((valor, j) => {
          const td = document.createElement('td');
          if (j === 2) td.className = 'horario';
          const input = document.createElement('input');
          input.value = valor;
          input.oninput = () => programacao[i][j] = input.value;
          td.appendChild(input);
          tr.appendChild(td);
        });

        const tdAcao = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = '×';
        btn.className = 'botao-excluir';
        btn.onclick = () => {
          programacao.splice(i, 1);
          renderizar();
        };
        tdAcao.appendChild(btn);
        tr.appendChild(tdAcao);
        tabela.appendChild(tr);
      });

      renderizarGrupo('centro');
      renderizarGrupo('norte');
    }

    function renderizarGrupo(nome) {
      const caixa = document.getElementById('grupo-' + nome);
      caixa.innerHTML = '';
      grupos[nome].forEach((pessoa, i) => {
        const div = document.createElement('div');
        div.className = 'pessoa';

        const input = document.createElement('input');
        input.value = pessoa;
        input.oninput = () => grupos[nome][i] = input.value;

        const btn = document.createElement('button');
        btn.textContent = '×';
        btn.className = 'botao-excluir';
        btn.onclick = () => {
          grupos[nome].splice(i, 1);
          renderizar();
        };

        div.appendChild(input);
        div.appendChild(btn);
        caixa.appendChild(div);
      });
    }

    function adicionarProgramacao() {
      programacao.push(['', '', '', '']);
      renderizar();
    }

    function adicionarPessoa(grupo) {
      grupos[grupo].push('');
      renderizar();
    }

    function salvar() {
      localStorage.setItem('programacao-ministerio-campo', JSON.stringify({ programacao, grupos }));
      alert('Salvo neste navegador.');
    }

    function restaurar() {
      const dados = localStorage.getItem('programacao-ministerio-campo');
      if (!dados) {
        alert('Nada salvo ainda.');
        return;
      }
      const restaurado = JSON.parse(dados);
      programacao = restaurado.programacao || programacao;
      grupos = restaurado.grupos || grupos;
      renderizar();
    }

    renderizar();
  </script></body>
</html>
