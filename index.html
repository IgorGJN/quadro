<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links Rápidos</title>
    <style>
        /* Estilos inspirados na paleta do jw.org */
        :root {
            --azul-jw: #4a6da7;
            --azul-escuro: #385380;
            --cinza-fundo: #f4f4f4;
            --branco: #ffffff;
            --texto: #333333;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            color: var(--texto);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        .header {
            background-color: var(--azul-jw);
            padding: 20px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: var(--branco);
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content {
            background-color: var(--branco);
            padding: 30px 20px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .description {
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #666;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: block;
            background-color: var(--branco);
            color: var(--azul-jw);
            text-decoration: none;
            padding: 15px;
            border: 2px solid var(--azul-jw);
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn-link:hover {
            background-color: var(--azul-jw);
            color: var(--branco);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(74, 109, 167, 0.3);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Acesso Rápido</h1>
        </header>

        <main class="content">
            <p class="description">Selecione uma das opções abaixo para ser redirecionado:</p>
            
            <div class="links-grid">
                <a href="tlp.html" target="_blank" class="btn-link">TLP</a>
                <a href="grupos.html" target="_blank" class="btn-link">Quadro</a>
                <a href="mapas/" target="_blank" class="btn-link">Mapas</a>
                <a href="jw.org" target="_blank" class="btn-link">JW</a>
            </div>
        </main>

        <footer class="footer">
            &copy; 2026 - Página de Links Personalizada
        </footer>
    </div>

</body>
</html>
