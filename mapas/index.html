<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Editor Offline de Territórios</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Editor Offline de Territórios</h1>

    <div class="top-actions">
      <label class="file-btn">
        Mapa
        <input id="imageInput" type="file" accept="image/*" />
      </label>

      <button id="saveLocalBtn" class="primary">Salvar local</button>
      <button id="exportPngBtn" class="primary">Exportar PNG</button>

      <button id="downloadJsonBtn">Baixar JSON</button>

      <label class="file-btn">
        Abrir JSON
        <input id="projectInput" type="file" accept="application/json,.json" />
      </label>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <section class="panel-section">
        <strong>Ferramentas</strong>

        <div class="tool-grid" id="toolButtons">
          <button data-tool="select" class="active">Selecionar</button>
          <button data-tool="edit">Editar nós</button>
          <button data-tool="connect">Conectar</button>
          <button data-tool="road">Rua</button>
          <button data-tool="text">Nome/Nº</button>
          <button data-tool="point">Ponto</button>
          <button data-tool="area">Área</button>
          <button data-tool="focus">Foco</button>
          <button data-tool="compass">Norte</button>
          <button data-tool="legend">Legenda</button>
        </div>

        <div class="hint" id="toolHint">
          Selecione uma ferramenta. No celular, use dois dedos para mover/zoom no mapa.
        </div>

        <div class="row action-row">
          <button id="finishRoadBtn" disabled>Concluir rua</button>
          <button id="finishAreaBtn" disabled>Concluir área</button>
          <button id="cancelDrawingBtn" disabled>Cancelar desenho</button>
        </div>
      </section>

      <section class="panel-section">
        <strong>Projeto</strong>

        <div class="field">
          <label for="projectNameInput">Nome do mapa</label>
          <input id="projectNameInput" placeholder="Ex.: Território Centro 01" />
        </div>

        <div class="field">
          <label for="localProjectsSelect">Mapas salvos neste navegador</label>
          <select id="localProjectsSelect"></select>
        </div>

        <div class="row action-row">
          <button id="openLocalBtn">Abrir local</button>
          <button id="newProjectBtn">Novo</button>
          <button id="deleteLocalBtn" class="danger">Apagar local</button>
        </div>

        <label class="check-row">
          <input id="autoSaveInput" type="checkbox" />
          Autosalvar localmente
        </label>

        <div class="field">
          <label for="versionSelect">Versões salvas</label>
          <select id="versionSelect"></select>
        </div>

        <div class="row action-row">
          <button id="saveVersionBtn">Salvar versão</button>
          <button id="restoreVersionBtn">Restaurar versão</button>
        </div>
      </section>

      <section class="panel-section">
        <strong>Edição</strong>

        <div class="empty-message" id="emptySelectionMessage">
          Selecione um item no mapa ou crie uma nova camada.
        </div>

        <div id="propertiesPanel">
          <div class="field field-name">
            <label id="nameLabel" for="nameInput">Texto</label>
            <textarea id="nameInput" rows="3" placeholder="Digite o texto. Na legenda, use uma linha por item."></textarea>
          </div>

          <div class="two-cols">
            <div class="field field-color">
              <label id="colorLabel" for="colorInput">Cor</label>
              <input id="colorInput" type="color" value="#2563eb" />
            </div>

            <div class="field field-border-color">
              <label id="borderColorLabel" for="borderColorInput">Cor da borda</label>
              <input id="borderColorInput" type="color" value="#ffffff" />
            </div>
          </div>

          <div class="field field-background">
            <label id="backgroundColorLabel" for="backgroundColorInput">Cor de fundo</label>
            <input id="backgroundColorInput" type="color" value="#ffffff" />
          </div>

          <div class="two-cols">
            <div class="field field-size">
              <label id="sizeLabel" for="sizeInput">Tamanho</label>
              <input id="sizeInput" type="number" value="16" min="1" max="200" />
            </div>

            <div class="field field-border-width">
              <label id="borderWidthLabel" for="borderWidthInput">Espessura da borda</label>
              <input id="borderWidthInput" type="number" value="0" min="0" max="80" />
            </div>
          </div>

          <div class="field field-opacity">
            <label id="opacityLabel" for="opacityInput">Transparência</label>
            <input id="opacityInput" type="range" value="0.45" min="0" max="1" step="0.05" />
          </div>

          <div class="field field-rotation">
            <label for="rotationInput">Rotação em graus</label>
            <input id="rotationInput" type="number" value="0" min="-180" max="180" />
          </div>

          <div class="field field-shape">
            <label for="shapeInput">Formato do foco</label>
            <select id="shapeInput">
              <option value="rect">Retângulo</option>
              <option value="ellipse">Circular/Oval</option>
            </select>
          </div>

          <div class="field field-icon">
            <label for="iconInput">Tipo de ponto</label>
            <select id="iconInput">
              <option value="●">Ponto</option>
              <option value="✚">Saúde</option>
              <option value="✝">Igreja</option>
              <option value="★">Referência</option>
              <option value="■">Prédio</option>
              <option value="⚑">Marco</option>
              <option value="⌂">Casa</option>
              <option value="ⓘ">Informação</option>
            </select>
          </div>

          <label class="check-row field-rounded">
            <input id="roundedInput" type="checkbox" checked />
            Pontas e junções arredondadas
          </label>

          <label class="check-row field-smooth">
            <input id="smoothInput" type="checkbox" />
            Suavizar forma/curva
          </label>

          <label class="check-row field-visible">
            <input id="visibleInput" type="checkbox" checked />
            Mostrar camada
          </label>

          <label class="check-row field-locked">
            <input id="lockedInput" type="checkbox" />
            Bloquear camada
          </label>

          <div class="row action-row">
            <button id="centerFocusBtn" class="hidden">Centralizar foco</button>
            <button id="duplicateBtn">Duplicar</button>
            <button id="bringForwardBtn">Frente</button>
            <button id="sendBackwardBtn">Trás</button>
            <button id="deleteBtn" class="danger">Excluir</button>
          </div>

          <div class="row action-row">
            <button id="removePointBtn" disabled>Remover ponto</button>
            <button id="splitRoadBtn" disabled>Dividir rua</button>
          </div>
        </div>
      </section>

      <section class="panel-section">
        <strong>Opções de desenho</strong>

        <label class="check-row">
          <input id="snapEnabledInput" type="checkbox" checked />
          Encaixar ruas/áreas em pontos próximos
        </label>

        <div class="field">
          <label for="snapDistanceInput">Distância de encaixe</label>
          <input id="snapDistanceInput" type="number" value="18" min="2" max="80" />
        </div>

        <label class="check-row">
          <input id="showNodesInput" type="checkbox" checked />
          Mostrar nós de conexão
        </label>

        <label class="check-row">
          <input id="nodeLabelsInput" type="checkbox" checked />
          Mostrar número de conexões
        </label>

        <div class="row action-row">
          <button id="createIntersectionsBtn">Criar interseções reais</button>
        </div>

        <div class="row action-row">
          <button id="undoBtn">Desfazer</button>
          <button id="redoBtn">Refazer</button>
          <button id="fitMapBtn">Ajustar mapa</button>
        </div>
      </section>

      <section class="panel-section">
        <strong>Camadas</strong>
        <div id="objectList" class="layer-list"></div>
      </section>
    </aside>

    <section class="canvas-wrap" id="canvasWrap">
      <canvas id="mapCanvas"></canvas>
      <div class="floating-help" id="floatingHelp">
        Carregue uma imagem do mapa para começar.
      </div>
      <div class="hidden" id="nodeHint"></div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
