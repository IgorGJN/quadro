<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3b6e" />
  <meta name="description" content="Editor de cartões de território: desenhe ruas, áreas e referências sobre o mapa e exporte para imprimir ou compartilhar." />
  <title>Mapas de Território</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=6.3" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn brand" id="projectsBtn" title="Meus mapas" aria-label="Meus mapas">
        <span data-icon="folder"></span>
      </button>
      <div class="title-block">
        <input id="projectName" class="project-name" placeholder="Mapa sem nome" aria-label="Nome do mapa" spellcheck="false" />
        <span class="save-status" id="saveStatus" aria-live="polite"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="undoBtn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><span data-icon="undo"></span></button>
        <button class="icon-btn" id="redoBtn" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><span data-icon="redo"></span></button>
        <span class="divider"></span>
        <button class="icon-btn hide-sm" id="helpBtn" title="Atalhos de teclado (?)" aria-label="Atalhos"><span data-icon="keyboard"></span></button>
        <div class="menu-wrap">
          <button class="btn primary" id="exportBtn" aria-haspopup="menu" aria-expanded="false">
            <span data-icon="download"></span><span class="hide-xs">Exportar</span>
          </button>
          <div class="menu" id="exportMenu" role="menu" hidden>
            <button role="menuitem" data-export="png"><span data-icon="image"></span>Baixar imagem (PNG)<small>2800 px</small></button>
            <button role="menuitem" data-export="png-hd"><span data-icon="image"></span>Baixar em alta resolução<small>5600 px</small></button>
            <button role="menuitem" data-export="copy"><span data-icon="clipboard"></span>Copiar imagem</button>
            <button role="menuitem" data-export="share" hidden><span data-icon="share"></span>Compartilhar…</button>
            <button role="menuitem" data-export="print"><span data-icon="print"></span>Imprimir no tamanho real</button>
            <hr />
            <button role="menuitem" data-export="json"><span data-icon="save"></span>Backup do projeto (.json)</button>
          </div>
        </div>
      </div>
    </header>

    <div class="main">
      <nav class="toolrail" id="toolrail" aria-label="Ferramentas">
        <div class="tool-group">
          <button class="tool" data-tool="select" title="Selecionar e editar (V)"><span data-icon="cursor"></span><em>Selecionar</em></button>
          <button class="tool" data-tool="pan" title="Mover o mapa (H ou segure Espaço)"><span data-icon="hand"></span><em>Mover</em></button>
        </div>
        <div class="tool-group">
          <button class="tool" data-tool="road" title="Rua (R)"><span data-icon="road"></span><em>Rua</em></button>
          <button class="tool" data-tool="area" title="Área / território (A)"><span data-icon="area"></span><em>Área</em></button>
          <button class="tool" data-tool="text" title="Texto, nome ou número (T)"><span data-icon="text"></span><em>Texto</em></button>
          <button class="tool" data-tool="marker" title="Ponto de referência (P)"><span data-icon="marker"></span><em>Ponto</em></button>
          <button class="tool" data-tool="focus" title="Foco: destaca uma região (F)"><span data-icon="focus"></span><em>Foco</em></button>
          <button class="tool" data-tool="compass" title="Norte (N)"><span data-icon="compass"></span><em>Norte</em></button>
          <button class="tool" data-tool="legend" title="Legenda (L)"><span data-icon="legend"></span><em>Legenda</em></button>
        </div>
        <div class="tool-group">
          <button class="tool" data-tool="frame" title="Enquadrar o cartão (C)"><span data-icon="crop"></span><em>Cartão</em></button>
        </div>
      </nav>

      <section class="stage" id="stage">
        <canvas id="canvas" aria-label="Área de desenho do mapa"></canvas>

        <div class="start" id="startScreen" hidden>
          <div class="start-card">
            <h2>Comece seu mapa de território</h2>
            <p>O jeito mais rápido é marcar as quadras no mapa. Se preferir, desenhe por cima de um print ou em branco.</p>
            <button class="start-hero" data-start="territory">
              <span data-icon="wand"></span>
              <span class="grow">
                <strong>Criar pelo mapa</strong>
                <small>Busque o endereço e toque nas quadras do território. Ruas com nome, quadras numeradas e referências são montadas sozinhas.</small>
              </span>
              <em>Recomendado</em>
            </button>
            <p class="start-or">ou comece do jeito manual</p>
            <div class="start-grid">
              <button class="start-option" data-start="osm">
                <span data-icon="globe"></span>
                <strong>Imagem do mapa</strong>
                <small>Capture uma região do OpenStreetMap e desenhe por cima</small>
              </button>
              <button class="start-option" data-start="image">
                <span data-icon="image"></span>
                <strong>Usar um print</strong>
                <small>Imagem do Google Maps, foto ou captura de tela</small>
              </button>
              <button class="start-option" data-start="blank">
                <span data-icon="area"></span>
                <strong>Em branco</strong>
                <small>Desenhar sem mapa de fundo</small>
              </button>
            </div>
            <p class="start-foot">Dica: cole uma captura com <kbd>Ctrl</kbd>+<kbd>V</kbd> ou arraste uma imagem para cá. <button class="link" data-start="json">Abrir backup .json</button></p>
          </div>
        </div>

        <div class="drop-hint" id="dropHint" hidden><span data-icon="image"></span>Solte a imagem ou o backup .json</div>

        <div class="hintbar" id="hintbar" hidden>
          <span class="hint-text" id="hintText"></span>
          <span class="hint-actions" id="hintActions"></span>
        </div>

        <div class="zoombar" aria-label="Zoom">
          <button class="icon-btn" id="zoomOutBtn" title="Afastar (−)" aria-label="Afastar"><span data-icon="minus"></span></button>
          <button class="zoom-value" id="zoomValue" title="Ver o cartão inteiro (0)">100%</button>
          <button class="icon-btn" id="zoomInBtn" title="Aproximar (+)" aria-label="Aproximar"><span data-icon="plus"></span></button>
        </div>
      </section>

      <aside class="panel" id="panel">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="item" class="active">Item</button>
          <button role="tab" data-tab="layers">Camadas <span class="count" id="layerCount"></span></button>
          <button role="tab" data-tab="settings">Mapa</button>
          <button class="icon-btn panel-toggle" id="panelToggle" aria-label="Recolher painel"><span data-icon="chevron"></span></button>
        </div>
        <div class="tab-body" data-body="item" id="inspector"></div>
        <div class="tab-body" data-body="layers" id="layers" hidden></div>
        <div class="tab-body" data-body="settings" id="settings" hidden></div>
      </aside>
    </div>
  </div>

  <input type="file" id="imageFile" accept="image/*" hidden />
  <input type="file" id="jsonFile" accept="application/json,.json" hidden />
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/util.js?v=6.3"></script>
  <script src="js/model.js?v=6.3"></script>
  <script src="js/render.js?v=6.3"></script>
  <script src="js/storage.js?v=6.3"></script>
  <script src="js/ui.js?v=6.3"></script>
  <script src="js/osm.js?v=6.3"></script>
  <script src="js/mvt.js?v=6.3"></script>
  <script src="js/vectormap.js?v=6.3"></script>
  <script src="js/territory.js?v=6.3"></script>
  <script src="js/overview.js?v=6.3"></script>
  <script src="js/editor.js?v=6.3"></script>
  <script src="js/app.js?v=6.3"></script>
</body>
</html>
